<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>SD MUHAMMADIYAH 1 SEDATI "ISLAMIC MODERN SCHOOL"</title>
    <style>
        * {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            letter-spacing: 1px;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-weight: bold;
            font-style: italic;
            font-size: 28px;
            margin: 50px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            overflow: visible;
            background-color: #fcfcfc;
        }

        @keyframes dariKiri {
            0% {
                transform: translateX(-30%);
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes dariAtas {
            0% {
                transform: translateY(-30%);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes munculBounce {
            0% {
                transform: translateY(20px) scale(0.85);
                opacity: 0;
            }

            60% {
                transform: translateY(-8px) scale(1.05);
                opacity: 1;
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .baris-atas {
            display: flex;
            align-items: center;
            animation: dariKiri 0.6s ease-out forwards;
            opacity: 0;
        }

        .biru-elegan {
            line-height: 0.9;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            background: linear-gradient(170deg,
                    rgba(255, 255, 255, 0.7) 0%,
                    rgba(255, 255, 255, 0.15) 45%,
                    rgba(255, 255, 255, 0) 45.5%,
                    rgba(255, 255, 255, 0) 100%),
                linear-gradient(to bottom, #1c3682 0%, #009ce0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sd-besar {
            font-size: 300%;
            line-height: 0.9;
            margin-top: 0;
        }

        .muhammadiyah {
            line-height: 0.9;
        }

        .sedati {
            line-height: 0.9;
        }

        .angka-satu {
            font-size: 160px;
            line-height: 1;
            margin-left: -30px;
            margin-top: 15px;
            background: linear-gradient(170deg,
                    rgba(255, 255, 255, 0.65) 0%,
                    rgba(255, 255, 255, 0.2) 35%,
                    rgba(255, 255, 255, 0) 35.5%,
                    rgba(255, 255, 255, 0) 100%),
                linear-gradient(to bottom, #bd1b21 0%, #e81c24 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 1px #ffffff);
            animation: dariAtas 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }

        .merah {
            color: #e31e24;
            margin-top: -2px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            animation: munculBounce 0.8s ease-out 0.5s forwards;
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="baris-atas">
        <div class="biru-elegan">
            <span class="sd-besar">SD</span>
            <span class="muhammadiyah">MUHAMMADIYAH</span>
            <span class="sedati">SEDATI</span>
        </div>
        <div class="angka-satu">1</div>
    </div>
    <div class="merah">“ISLAMIC MODERN SCHOOL”</div>
</body>

</html>
