<svg viewBox="207 57 266 266" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Logo VervalSP</title>
<desc>Logo Verval SP — platform verifikasi dan validasi satuan pendidikan.</desc>
<defs>
  <!-- Main circle: white center → very light blue → blue edge -->
  <radialGradient id="mainGrad" cx="42%" cy="36%" r="72%">
    <stop offset="0%"   stop-color="#FFFFFF"/>
    <stop offset="35%"  stop-color="#FFFFFF"/>
    <stop offset="65%"  stop-color="#E0F2FF"/>
    <stop offset="85%"  stop-color="#90CAF9"/>
    <stop offset="100%" stop-color="#1565C0"/>
  </radialGradient>

  <!-- Outer ring: very dark navy -->
  <radialGradient id="outerRing" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#0A1F4E"/>
    <stop offset="100%" stop-color="#010510"/>
  </radialGradient>

  <!-- Specular highlight (subtle, already very bright) -->
  <radialGradient id="specGrad" cx="32%" cy="24%" r="48%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <!-- Arrow head -->
  <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1 L9 5 L1 9 Z" fill="#A8D8FF"/>
  </marker>

  <!-- Badge gradients — vivid, high-contrast -->
  <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#FFAB40"/>
    <stop offset="100%" stop-color="#E65100"/>
  </linearGradient>
  <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#CE93D8"/>
    <stop offset="100%" stop-color="#6A1B9A"/>
  </linearGradient>
  <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#69F0AE"/>
    <stop offset="100%" stop-color="#00695C"/>
  </linearGradient>
  <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#FF80AB"/>
    <stop offset="100%" stop-color="#AD1457"/>
  </linearGradient>
</defs>

<!-- ── Outer ring ── -->
<circle cx="340" cy="190" r="125" fill="url(#outerRing)"/>

<!-- ── Inner disc ── -->
<circle cx="340" cy="190" r="104" fill="url(#mainGrad)"/>

<!-- ── Specular highlight ── -->
<circle cx="340" cy="190" r="104" fill="url(#specGrad)"/>

<!-- ── Sync arrows ── -->
<g fill="none" stroke="#A8D8FF" stroke-width="5.5" stroke-linecap="round" opacity="0.65">
  <path d="M 248 158 A 104 104 0 0 1 318 90" marker-end="url(#arrowHead)"/>
  <path d="M 432 222 A 104 104 0 0 1 362 290" marker-end="url(#arrowHead)"/>
</g>

<!-- ── Ground shadow ── -->
<rect x="292" y="226" width="96" height="5" rx="1" fill="#07193A" opacity="0.75"/>

<!-- ── LEFT building ── -->
<g>
  <polygon points="304,178 320,164 336,178" fill="#0D3B72"/>
  <rect x="304" y="178" width="32" height="46" rx="1.5" fill="#0D3B72"/>
  <!-- windows — bright amber glow -->
  <rect x="310" y="186" width="7" height="32" rx="1" fill="#FFB300"/>
  <rect x="325" y="186" width="7" height="32" rx="1" fill="#FFB300"/>
</g>

<!-- ── CENTER building (tallest) ── -->
<g>
  <polygon points="340,136 367,160 313,160" fill="#0A2F5C"/>
  <rect x="313" y="160" width="54" height="64" rx="1.5" fill="#0A2F5C"/>
  <!-- windows — bright amber glow -->
  <rect x="320" y="169" width="7" height="49" rx="1" fill="#FFB300"/>
  <rect x="337" y="169" width="7" height="49" rx="1" fill="#FFB300"/>
  <rect x="354" y="169" width="7" height="49" rx="1" fill="#FFB300"/>
</g>

<!-- ── RIGHT building ── -->
<g>
  <polygon points="368,170 384,158 400,170" fill="#0D3B72"/>
  <rect x="368" y="170" width="32" height="54" rx="1.5" fill="#0D3B72"/>
  <!-- windows — bright amber glow -->
  <rect x="374" y="178" width="7" height="40" rx="1" fill="#FFB300"/>
  <rect x="389" y="178" width="7" height="40" rx="1" fill="#FFB300"/>
</g>

<!-- ── Base platform ── -->
<rect x="296" y="224" width="112" height="8" rx="2" fill="#0A2F5C"/>

<!-- ── BADGE 1 — Lokasi / Map pin — vivid orange ── -->
<g transform="translate(258,118)">
  <circle r="21" fill="url(#orangeGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- pin shape -->
  <path d="M0,-9.5 C5.5,-9.5 9.5,-5.5 9.5,0
           C9.5,7 0,14.5 0,14.5
           C0,14.5 -9.5,7 -9.5,0
           C-9.5,-5.5 -4.5,-9.5 0,-9.5 Z"
        fill="#FFFFFF" transform="scale(0.64)"/>
  <circle r="3" fill="#E65100" transform="scale(0.64)"/>
</g>

<!-- ── BADGE 2 — Foto / Camera — vivid purple ── -->
<g transform="translate(422,118)">
  <circle r="21" fill="url(#purpleGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- camera body -->
  <rect x="-9" y="-5.5" width="18" height="12.5" rx="2.5" fill="#FFFFFF"/>
  <!-- top bump (lens mount) -->
  <rect x="-3.5" y="-8.5" width="7" height="4" rx="1.5" fill="#FFFFFF"/>
  <!-- lens outer -->
  <circle cx="0" cy="0.7" r="4.2" fill="#6A1B9A"/>
  <!-- lens inner -->
  <circle cx="0" cy="0.7" r="2.2" fill="#E1BEE7"/>
</g>

<!-- ── BADGE 3 — Identitas / ID card — vivid green ── -->
<g transform="translate(258,262)">
  <circle r="21" fill="url(#greenGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- card body -->
  <rect x="-10.5" y="-7.5" width="21" height="15" rx="2.5" fill="#FFFFFF"/>
  <!-- avatar circle -->
  <circle cx="-5" cy="-1" r="3" fill="#00695C"/>
  <!-- text lines -->
  <rect x="0.5" y="-3.5" width="8" height="1.8" rx="0.9" fill="#00695C"/>
  <rect x="0.5" y="0.5"  width="8" height="1.8" rx="0.9" fill="#00695C"/>
</g>

<!-- ── BADGE 4 — Surat/Izin — vivid rose ── -->
<g transform="translate(422,262)">
  <circle r="21" fill="url(#roseGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- document body -->
  <rect x="-8.5" y="-11" width="17" height="22" rx="2" fill="#FFFFFF"/>
  <!-- lines -->
  <rect x="-5.5" y="-7"   width="11" height="1.8" rx="0.9" fill="#AD1457"/>
  <rect x="-5.5" y="-3.2" width="11" height="1.8" rx="0.9" fill="#AD1457"/>
  <!-- checkmark circle -->
  <circle cx="0" cy="6" r="6" fill="#AD1457"/>
  <path d="M-3,6 L-0.8,8.3 L3.5,2.8" fill="none" stroke="#FFFFFF"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>

</svg>
