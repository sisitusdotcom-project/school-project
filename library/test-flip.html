<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Real3D Flipbook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/vendor/flipbook/css/flipbook.style.css">
<style>
body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#3E444C; }
#flipContainer { width:100%; height:100%; }
</style>
<script src="assets/vendor/dflip/js/libs/jquery.min.js"></script>
<script src="assets/vendor/flipbook/js/pdf.min.js"></script>
<script src="assets/vendor/flipbook/js/pdf.worker.min.js"></script>
<script src="assets/vendor/flipbook/js/three.min.js"></script>
<script src="assets/vendor/flipbook/js/flipbook.min.js"></script>
</head>
<body>
<div id="flipContainer"></div>
<script>
$(document).ready(function() {
  $("#flipContainer").flipBook({
    pdfUrl: "buku-perpus/pedoman-hidup-islami-warga-muhammadiyah.pdf",
    assets: {
      preloader: "assets/vendor/flipbook/images/preloader.jpg",
      overlay: "assets/vendor/flipbook/images/overlay.png",
      flipMp3: "assets/vendor/flipbook/mp3/turnPage.mp3"
    },
    backgroundColor: "#3E444C",
    skin: "light",
    viewMode: "3d",
    responsiveView: true,
    pdfBrowserViewerIfMobile: false,
    pdfPageScale: 1.5,
    sound: true
  });
});
</script>
</body>
</html>
